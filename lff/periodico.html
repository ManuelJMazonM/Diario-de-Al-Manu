<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>El Diario del Míster</title>
<style>
  :root{--paper:#f4efe4;--ink:#1b1814;--muted:#6b6358;--rule:#1b1814;--red:#b3261e;--soft:#e6dfd0}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
       font-family:Georgia,"Times New Roman",Times,serif;line-height:1.45}
  .wrap{max-width:1080px;margin:0 auto;padding:18px 18px 48px}
  header.mast{text-align:center;border-bottom:4px double var(--rule);padding-bottom:10px}
  .ear{display:flex;justify-content:space-between;font:600 11px/1.3 system-ui,sans-serif;
       letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  h1.name{font-family:"Didot","Bodoni MT","Playfair Display",Georgia,serif;font-weight:900;
          font-size:clamp(40px,9vw,92px);letter-spacing:-.02em;margin:6px 0 2px;line-height:.95}
  .dateline{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;border-top:1px solid var(--rule);
            border-bottom:1px solid var(--rule);margin-top:8px;padding:5px 0;
            font:600 12px system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase}
  .kicker{font:700 11px system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
  .lead{padding:22px 0 18px;border-bottom:1px solid var(--rule);text-align:center}
  .lead h2{font-size:clamp(30px,5.6vw,58px);line-height:1.02;margin:8px auto 12px;max-width:22ch;
           font-weight:900;letter-spacing:-.015em}
  .lead p{max-width:62ch;margin:0 auto;font-size:18px;color:#3a342c;font-style:italic}
  .grid{display:grid;grid-template-columns:1.25fr 1fr .9fr;gap:0;margin-top:16px}
  .col{padding:0 18px;border-left:1px solid var(--rule)}
  .col:first-child{padding-left:0;border-left:0}
  .col:last-child{padding-right:0}
  h3.sec{font:800 13px system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;
         border-top:3px solid var(--rule);border-bottom:1px solid var(--rule);padding:5px 0;margin:0 0 10px}
  .brief{padding:10px 0;border-bottom:1px dotted #9b917f}
  .brief:last-child{border-bottom:0}
  .brief h4{margin:2px 0 0;font-size:20px;line-height:1.15}
  .editorial p{margin:0 0 10px;font-size:16px;text-align:justify;hyphens:auto}
  .editorial p:first-child::first-letter{float:left;font-size:58px;line-height:.85;padding:4px 6px 0 0;font-weight:900}
  table{width:100%;border-collapse:collapse;font:14px system-ui,sans-serif}
  th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;text-align:left;color:var(--muted);
     border-bottom:1px solid var(--rule);padding:4px 2px}
  td{padding:6px 2px;border-bottom:1px solid var(--soft)}
  td.n{text-align:right;font-variant-numeric:tabular-nums}
  tr.top td{font-weight:700}
  .up{color:#1d6b35}.down{color:var(--red)}.eq{color:var(--muted)}
  .mkt{font:14px system-ui,sans-serif;padding:7px 0;border-bottom:1px solid var(--soft)}
  .mkt b{font-family:Georgia,serif;font-size:15px}
  .tag{display:inline-block;font:700 9px system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;
       padding:2px 5px;border:1px solid currentColor;margin-right:5px;vertical-align:1px}
  .tag.clausulazo{color:var(--red)} .tag.venta{color:#1d6b35} .tag.fichaje,.tag.compra{color:#24476b}
  .box{background:var(--soft);padding:12px 14px;margin-bottom:14px;border-top:3px solid var(--rule)}
  .box .big{font-size:24px;font-weight:900;line-height:1.1;margin:4px 0}
  .box small{font:12px system-ui,sans-serif;color:var(--muted)}
  .lead .dek{font-style:normal;font-weight:700;font-size:19px;color:var(--ink);margin-bottom:12px}
  .lead .body{columns:2 300px;column-gap:28px;column-rule:1px solid var(--soft);text-align:justify;
              max-width:900px;margin:12px auto 0;font-size:17px;font-style:normal;color:var(--ink)}
  .lead .body p{margin:0 0 10px;max-width:none;font-style:normal;font-size:17px;color:var(--ink);hyphens:auto}
  .lead .body p:first-child::first-letter{float:left;font-size:60px;line-height:.85;padding:4px 6px 0 0;font-weight:900}
  .feature{padding:4px 0 14px;border-bottom:1px solid var(--rule);margin-bottom:12px}
  .feature h4{font-size:26px;line-height:1.08;margin:4px 0 6px;font-weight:900}
  .feature .dek{font-weight:700;margin:0 0 8px}
  .feature p{margin:0 0 8px;text-align:justify;hyphens:auto}
  .score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center;
         background:var(--ink);color:var(--paper);padding:12px 8px;margin:6px 0 10px}
  .score .tm{font:700 13px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.04em}
  .score .res{font:900 34px Georgia,serif;letter-spacing:.04em}
  .match h4{font-size:21px;line-height:1.12;margin:2px 0 6px}
  .match p{margin:0 0 8px;font-size:15px}
  .star{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:baseline;padding:7px 0;
        border-bottom:1px solid var(--soft)}
  .star .n{font:900 20px Georgia,serif;color:var(--red)}
  .star b{font-size:16px}.star small{display:block;font:12px system-ui,sans-serif;color:var(--muted)}
  .star .pts{font:800 18px system-ui,sans-serif}
  .free{color:var(--red);font-weight:700}
  .duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
  .duo .box{margin:0}
  .res-row{display:flex;justify-content:space-between;gap:8px;font:14px system-ui,sans-serif;
           padding:5px 0;border-bottom:1px solid var(--soft)}
  .res-row b{font-variant-numeric:tabular-nums;white-space:nowrap}
  footer{margin-top:28px;border-top:4px double var(--rule);padding-top:8px;text-align:center;
         font:12px system-ui,sans-serif;color:var(--muted)}
  @media (max-width:860px){
    .grid{grid-template-columns:1fr}
    .col{padding:0;border-left:0;margin-bottom:22px}
    .ear span:last-child{display:none}
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const E = /*EDITION*/null;
const $ = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const M = (x) => x == null ? "—" : (x/1e6).toLocaleString("es-ES",{maximumFractionDigits:1}) + " M€";
const fecha = new Date(E.date + "T12:00:00").toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const dt = (d) => d ? new Date(d).toLocaleDateString("es-ES",{day:"numeric",month:"short"}) : "";
const verb = {fichaje:"ficha a",compra:"compra a",clausulazo:"clausula a",venta:"vende a"};
const arrow = (d) => d > 0 ? `<span class="up">▲${d}</span>` : d < 0 ? `<span class="down">▼${-d}</span>` : `<span class="eq">=</span>`;
const kick = {estrella:"La jornada",clausulazo:"Última hora",fichaje:"Mercado",compra:"Mercado",venta:"Mercado",
              nuevo_lider:"Clasificación",subida:"Clasificación",bajada:"Clasificación",lider:"Clasificación"};
const J = E.jornada;
const editorial = String(E.editorial||"").split(/\n\s*\n/).map(p=>`<p>${$(p)}</p>`).join("");

document.title = E.title;
document.getElementById("app").innerHTML = `
<header class="mast">
  <div class="ear"><span>${$(E.league || "Liga privada")}</span><span>Edición diaria · Precio: 0 M€</span></div>
  <h1 class="name">${$(E.title)}</h1>
  <div class="dateline"><span>${$(fecha)}</span>${E.week ? `<span>Jornada ${$(E.week)}</span>` : ""}<span>${E.standing.length} mánagers</span></div>
</header>

<section class="lead">
  <div class="kicker">${$(kick[E.lead.kind] || "Portada")}</div>
  <h2>${$(E.lead.headline)}</h2>
  ${E.lead.dek ? `<p class="dek">${$(E.lead.dek)}</p>` : ""}
  ${(E.lead.body||[]).length ? `<div class="body">${E.lead.body.map(p=>`<p>${$(p)}</p>`).join("")}</div>`
     : `<p>${$(E.standing[0].team)} encabeza la tabla con ${$(E.standing[0].points)} puntos.</p>`}
</section>

<div class="grid">
  <div class="col">
    ${E.features.length ? `<h3 class="sec">Reportajes</h3>` + E.features.map(f => `<article class="feature">
      <div class="kicker">${$(kick[f.kind]||"Mercado")}${f.date?" · "+dt(f.date):""}</div>
      <h4>${$(f.headline)}</h4>${f.dek?`<p class="dek">${$(f.dek)}</p>`:""}
      ${f.body.map(p=>`<p>${$(p)}</p>`).join("")}</article>`).join("") : ""}
    <h3 class="sec">Más noticias</h3>
    ${E.briefs.length ? E.briefs.map(b => `<div class="brief"><div class="kicker">${$(kick[b.kind]||"")}${b.date?" · "+dt(b.date):""}</div><h4>${$(b.headline)}</h4>${b.dek?`<p style="margin:4px 0 0">${$(b.dek)}</p>`:""}</div>`).join("")
                      : `<p><i>Semana tranquila. Demasiado tranquila.</i></p>`}
  </div>

  <div class="col">
    <h3 class="sec">Editorial</h3>
    <div class="editorial">${editorial}</div>
    <h3 class="sec" style="margin-top:18px">Clasificación</h3>
    <table>
      <tr><th>#</th><th>Equipo</th><th class="n">Pts</th><th class="n">${E.points_week ? "J"+E.points_week : "J."}</th><th class="n">±</th></tr>
      ${E.standing.map((t,i) => `<tr class="${i==0?"top":""}"><td>${t.position}</td>
        <td>${$(t.team)}${t.manager && t.manager!==t.team ? `<br><small style="color:var(--muted)">${$(t.manager)}</small>`:""}</td>
        <td class="n">${$(t.points)}</td><td class="n">${t.week_points ?? "—"}</td><td class="n">${arrow(t.delta)}</td></tr>`).join("")}
    </table>
    <h3 class="sec" style="margin-top:18px">Mercado de fichajes</h3>
    ${E.market.length ? E.market.map(a => `<div class="mkt"><span class="tag ${a.type}">${a.type}</span>
      <b>${$(a.who)}</b> ${verb[a.type]||""} <b>${$(a.player)}</b>${a.other && a.type!=="fichaje" && a.type!=="venta" ? ` (de ${$(a.other)})`:""}
      · ${M(a.amount)} <span style="color:var(--muted)">${dt(a.date)}</span></div>`).join("")
      : `<p><i>Ni un movimiento esta semana.</i></p>`}
  </div>

  <div class="col">
    ${J ? `<h3 class="sec">Jornada ${$(J.week)}</h3>
    ${J.featured ? `<div class="match"><div class="kicker">Partido de la jornada</div>
      <div class="score"><span class="tm">${$(J.featured.match.local)}</span><span class="res">${J.featured.match.ls}-${J.featured.match.vs}</span><span class="tm">${$(J.featured.match.visitor)}</span></div>
      <h4>${$(J.featured.headline)}</h4>${J.featured.body.map(p=>`<p>${$(p)}</p>`).join("")}</div>` : ""}
    ${J.stars.length ? `<h3 class="sec" style="margin-top:16px">Estrellas de la jornada</h3>
      ${J.stars.map((p,i)=>`<div class="star"><span class="n">${i+1}</span><span><b>${$(p.name)}</b>
        <small>${$(p.club||"")} · ${p.owner ? $(p.owner) : `<span class="free">sin dueño</span>`}</small></span>
        <span class="pts">${$(p.points)}</span></div>`).join("")}` : ""}
    ${J.crack || J.paquete ? `<div class="duo">
      ${J.crack ? `<div class="box"><div class="kicker">El crack de la liga</div><div class="big">${$(J.crack.name)}</div><small>${$(J.crack.points)} ${Math.abs(J.crack.points)==1?"pt":"pts"} · ${$(J.crack.owner)}</small></div>`:""}
      ${J.paquete ? `<div class="box"><div class="kicker">El paquete</div><div class="big">${$(J.paquete.name)}</div><small>${$(J.paquete.points)} ${Math.abs(J.paquete.points)==1?"pt":"pts"} · ${$(J.paquete.owner)}</small></div>`:""}
    </div>` : ""}
    ${J.results.length ? `<h3 class="sec">Resultados</h3>${J.results.map(r=>`<div class="res-row"><span>${$(r.local)} – ${$(r.visitor)}</span><b>${r.ls ?? "-"} - ${r.vs ?? "-"}</b></div>`).join("")}` : ""}
    ` : `<h3 class="sec">La jornada</h3><p><i>Todavía no hay datos de la jornada.</i></p>`}
  </div>
</div>

<footer>${$(E.title)} · Periódico no oficial hecho entre amigos con datos de LaLiga Fantasy · Generado el ${$(E.date)}</footer>`;
</script>
</body>
</html>
