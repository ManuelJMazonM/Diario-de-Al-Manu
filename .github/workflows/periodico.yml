# Edición diaria automática del periódico.
# Sin acciones externas (uses:): solo git, python3 y gh, que ya vienen en la máquina.
# La web se publica en la rama gh-pages (Settings → Pages → Deploy from a branch → gh-pages).
#
# Secretos necesarios (Settings → Secrets and variables → Actions):
#   LALIGA_TOKENS      → contenido completo de tokens.json
#   GH_PAT             → token fine-grained SOLO de este repo con "Secrets: Read and write"
#   ANTHROPIC_API_KEY  → opcional, textos escritos por IA
name: Periodico diario

on:
  schedule:
    - cron: "17 6 * * *"   # 07:17 en España (invierno)
    - cron: "43 9 * * *"    # 10:43, por si GitHub se salta la primera
    
  workflow_dispatch:

permissions:
  contents: write

jobs:
  edicion:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          python3 --version

      - name: Restaurar token (nunca se imprime)
        working-directory: repo
        env:
          T: ${{ secrets.LALIGA_TOKENS }}
        run: |
          umask 077
          printf '%s' "$T" > tokens.json

      - name: Generar edicion
        working-directory: repo
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 periodico.py daily

      - name: Guardar el refresh_token nuevo y borrar el archivo
        if: always()
        working-directory: repo
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -s tokens.json ]; then gh secret set LALIGA_TOKENS --repo "$GITHUB_REPOSITORY" < tokens.json; fi
          rm -f tokens.json

      - name: Guardar historial (data/) en main
        working-directory: repo
        run: |
          git config user.name "periodico-bot"
          git config user.email "periodico-bot@users.noreply.github.com"
          git add data
          git commit -m "Edicion $(date +%F)" || echo "sin cambios"
          git push

      - name: Publicar la web en la rama gh-pages
        working-directory: repo/site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "periodico-bot"
          git config user.email "periodico-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Web $(date +%F)"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
